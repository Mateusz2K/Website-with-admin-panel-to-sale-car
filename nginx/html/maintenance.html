<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przerwa Techniczna - AutoKonkret</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #212529;
            color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 40px;
            border: 1px solid #495057;
            border-radius: 10px;
            background-color: #343a40;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 600px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #0d6efd; }
        p { font-size: 1.2rem; line-height: 1.6; }
        .icon { font-size: 4rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛠️</div>
        <h1>Przerwa Techniczna</h1>
        <p>Przepraszamy, aktualnie prowadzimy prace modernizacyjne na serwerze.</p>
        <p>Strona będzie dostępna wkrótce. Dziękujemy za cierpliwość!</p>
        <p style="margin-top: 30px; font-size: 0.9rem; color: #adb5bd;">Zespół AutoKonkret</p>
    </div>
</body>
</html>
