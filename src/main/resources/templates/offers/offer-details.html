<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${offer.brand?.nazwaMarki + ' ' + offer.model?.model}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home-style.css}">
</head>
<body>
<div th:replace="~{/public/fragments/navigation :: navbar}"></div>
<main class="container mt-5 py-5">
    <div class="row">
        <div class="col-lg-8">
            <h1 th:text="${offer.brand?.nazwaMarki + ' ' + offer.model?.model}"></h1>
            <h2 class="h4 text-muted mb-4" th:text="${offer.rok}"></h2>
            <div id="photoCarousel" class="carousel slide shadow-lg rounded overflow-hidden mb-4" >
                <div class="carousel-inner">
                    <div th:if="${offer.zdjęcia.isEmpty()}"><img th:src="@{${@systemSettingService.getDefaultOfferImageUrl()}}" class="d-block w-100" alt="..." loading="lazy"></div>
                    <!-- ZMIANA: Dodano loading="lazy" -->
                    <div th:each="image, iterStat : ${offer.zdjęcia}" class="carousel-item" th:classappend="${iterStat.first ? 'active' : ''}"><img th:src="@{/car_photo/{imageName}(imageName=${image.fileName})}" class="d-block w-100" alt="..." loading="lazy"></div>
                </div>
                <button th:if="${offer.zdjęcia.size() > 1}" class="carousel-control-prev" type="button" data-bs-target="#photoCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                <button th:if="${offer.zdjęcia.size() > 1}" class="carousel-control-next" type="button" data-bs-target="#photoCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
            </div>
            <div class="row mt-5">
                <div class="col-12">
                    <h3>Opis</h3>
                    <p th:text="${offer.opis}"></p>
                </div>
            </div>
            <div class="row mt-5" th:if="${!offer.options.isEmpty()}">
                <div class="col-12">
                    <h3>Wyposażenie</h3>
                    <div class="row">
                        <div th:each="category : ${T(pl.konkretnefury.konkretnefury.modele.TypeOfCarOptions).values()}" class="col-md-4 mb-3">
                            <div th:if="${!offer.options.?[category == #root.category].isEmpty()}">
                                <h5 class="mt-2" th:text="${category.displayName}"></h5>
                                <ul class="list-unstyled">
                                    <li th:each="option : ${offer.options.?[category == #root.category]}" th:text="${option.name}"></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card sticky-top" style="top: 100px;">
                <div class="card-body">
                    <th:block th:if="${offer.status?.name() == 'SPRZEDANY'}"><h3 class="card-title text-danger">Oferta nieaktualna</h3></th:block>
                    <th:block th:unless="${offer.status?.name() == 'SPRZEDANY'}"><h3 class="card-title price" th:text="${{offer.cena}}"></h3></th:block>
                    <hr>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between"><strong>Marka:</strong> <span th:text="${offer.brand?.nazwaMarki}"></span></li>
                        <li class="list-group-item d-flex justify-content-between"><strong>Model:</strong> <span th:text="${offer.model?.model}"></span></li>
                        <li class="list-group-item d-flex justify-content-between"><strong>Rocznik:</strong> <span th:text="${offer.rok}"></span></li>
                        <li class="list-group-item d-flex justify-content-between"><strong>Przebieg:</strong> <span th:text="${{offer.przebieg}}"></span></li>
                        <li class="list-group-item d-flex justify-content-between"><strong>Pojemność:</strong> <span th:text="${{offer.pojemonscSilnika}}"></span></li>
                        <li class="list-group-item d-flex justify-content-between"><strong>Moc:</strong> <span th:text="${{offer.moc}}"></span></li>
                        <li class="list-group-item d-flex justify-content-between" th:if="${offer.rodzajPaliwa != null}"><strong>Paliwo:</strong> <span th:text="${offer.rodzajPaliwa.displayName}"></span></li>
                        <li class="list-group-item d-flex justify-content-between" th:if="${offer.rodzajNadwozia != null}"><strong>Nadwozie:</strong> <span th:text="${offer.rodzajNadwozia.displayName}"></span></li>
                        <li class="list-group-item d-flex justify-content-between" th:if="${offer.kolor != null}"><strong>Kolor:</strong> <span th:text="${offer.kolor}"></span></li>
                        <li class="list-group-item d-flex justify-content-between" th:if="${offer.KrajPochodzenia != null}"><strong>Kraj pochodzenia:</strong> <span th:text="${offer.KrajPochodzenia}"></span></li>
                        <li class="list-group-item d-flex justify-content-between" th:if="${offer.skrzyniaBiegow != null}"><strong>Skrzynia biegów:</strong> <span th:text="${offer.skrzyniaBiegow.displayName}"></span></li>
                        <li class="list-group-item d-flex justify-content-between" th:if="${offer.naped != null}"><strong>Napęd:</strong> <span th:text="${offer.naped.displayName}"></span></li>
                        <li class="list-group-item d-flex justify-content-between" th:if="${offer.typPojazdu != null}"><strong>Typ pojazdu:</strong> <span th:text="${offer.typPojazdu.displayName}"></span></li>
                        <li class="list-group-item d-flex justify-content-between" th:if="${offer.gwarancjaOpis != null and !offer.gwarancjaOpis.isEmpty()}"><strong>Gwarancja:</strong> <span th:text="${offer.gwarancjaOpis}"></span></li>
                        <li class="list-group-item d-flex justify-content-between"><strong>Status:</strong> <span class="badge" th:classappend="${offer.status?.name() == 'DOSTĘPNY' ? 'bg-success' : 'bg-warning'}" th:text="${offer.status?.displayName}"></span></li>
                    </ul>
                    <a href="#" class="btn btn-primary w-100 mt-3">Skontaktuj się</a>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{/public/fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
