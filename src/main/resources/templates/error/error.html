<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wystąpił błąd - AutoKonkret</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        .error-container {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .error-icon {
            font-size: 5rem;
            color: #dc3545;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div th:replace="~{public/fragments/navigation :: navbar}"></div>

    <main class="error-container">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1 class="display-4 fw-bold mb-3">Ups! Coś poszło nie tak.</h1>
        <p class="lead mb-4">Wystąpił nieoczekiwany błąd. Nasi specjaliści już nad tym pracują.</p>

        <!-- Opcjonalnie: Wyświetlenie szczegółów błędu (tylko dla admina lub w dev) -->
        <div th:if="${status}" class="mb-4">
            <span class="badge bg-secondary" th:text="'Kod błędu: ' + ${status}"></span>
        </div>

        <a th:href="@{/}" class="btn btn-primary btn-lg">
            <i class="fas fa-home me-2"></i> Wróć na stronę główną
        </a>
    </main>

    <div th:replace="~{public/fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
