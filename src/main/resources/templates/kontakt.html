<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mateusz Kołecki">

    <title>Kontakt - AutoKonkret</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div id="container">
        <!-- Dynamiczna nawigacja -->
        <div th:replace="~{public/fragments/navigation :: navbar}"></div>

        <div class="container my-5">
            <h1 class="text-center mb-4">Kontakt</h1>

            <div class="row mb-5">
              <div class="col-md-6">
                <h4>Dane kontaktowe</h4>
                <p><strong>AutoKonkret Dominik Szanecki</strong><br>
                Tuchola, Kujawsko-Pomorskie<br>
                <strong>Tel:</strong> <a href="tel:+48693265264" class="link-dark">+48 693 265 264</a><br>
                <strong>Email:</strong> <a href="mailto:konkretnefury@gmail.com" class="link-dark">konkretnefury@gmail.com</a></p>
              </div>

              <div class="col-md-6">
                <h4>Formularz kontaktowy</h4>
                <!-- Uwaga: Formularz wymaga backendu do obsługi wysyłki maili -->
                <form action="#" method="POST">
                    <div class="mb-3">
                      <label for="name" class="form-label">Imię i nazwisko</label>
                      <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                      <label for="email" class="form-label">Adres e-mail</label>
                      <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                      <label for="message" class="form-label">Wiadomość</label>
                      <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Wyślij</button>
                  </form>
              </div>
            </div>

            <div class="mb-5">
              <h4>Znajdź nas na mapie</h4>
              <div class="ratio ratio-16x9">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d37901.91315195407!2d17.83900552595588!3d53.57794432329846!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4702571a060d2b9d%3A0xe893321dad08b449!2sTuchola!5e0!3m2!1spl!2spl!4v1746185114314!5m2!1spl!2spl" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
              </div>
            </div>

            <div class="text-center">
              <p class="fs-5">Masz pytania? Skontaktuj się z nami – pomożemy znaleźć idealne auto dla Ciebie!</p>
            </div>
        </div>

        <!-- Dynamiczna stopka -->
        <div th:replace="~{public/fragments/footer :: footer}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/script.js}"></script>
</body>
</html>
