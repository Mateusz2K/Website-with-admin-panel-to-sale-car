<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konkretne Fury - Twój wymarzony samochód</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/home-style.css}">
</head>
<body>

<div th:replace="~{/public/fragments/navigation :: navbar}"></div>

<header class="hero-section text-center text-white d-flex align-items-center justify-content-center">
    <div class="container">
        <h1 class="display-3">Znajdź Swój Wymarzony Samochód</h1>
        <p class="lead">Przeglądaj nasze najlepsze oferty i dołącz do grona zadowolonych klientów.</p>
        <a th:href="@{/offers}" class="btn btn-primary btn-lg mt-3">Zobacz Wszystkie Oferty</a>
    </div>
</header>

<section class="featured-offers py-5">
    <div class="container">
        <h2 class="text-center mb-5">Promowane Oferty</h2>
        <div class="row">
            <div th:each="offer : ${featuredOffers}" class="col-md-6 col-lg-4 mb-4">
                <div class="card offer-card h-100">
                    <!-- ZMIANA: Dodano kontener dla obrazka i maski -->
                    <div class="card-img-container">
                        <th:block th:with="mainImage=${offer.getMainImage().orElse(null)}">
                            <img th:if="${mainImage != null}" th:src="@{/car_photo/{fileName}(fileName=${mainImage.fileName})}" class="card-img-top" alt="Zdjęcie samochodu">
                            <img th:if="${mainImage == null}" th:src="@{/img/placeholder.png}" class="card-img-top" alt="Brak zdjęcia">
                        </th:block>
                        <!-- ZMIANA: Warunkowe wyświetlanie maski -->
                        <div th:if="${offer.status.name() == 'ZAREZERWOWANY' or offer.status.name() == 'SPRZEDANY'}"
                             class="status-overlay"
                             th:text="${offer.status.displayName}">
                        </div>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${offer.brand?.nazwaMarki + ' ' + offer.model?.model}"></h5>
                        <p class="card-text text-muted" th:text="${offer.rok}"></p>
                        <h6 class="price mt-auto" th:text="${{offer.cena}}"></h6>
                        <a th:href="@{/offers/{id}(id=${offer.id})}" class="btn btn-outline-primary mt-2">Zobacz Szczegóły</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{/public/fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
