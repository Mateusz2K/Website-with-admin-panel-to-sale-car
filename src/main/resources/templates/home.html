<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mateusz Kołecki">
    <meta name="description" content="AutoKonkret - znajdź idealny samochód dla siebie. Oferujemy szeroki wybór pojazdów, aktualności i promocje.">
    <title>AutoKonkret - Twoje wymarzone samochody</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/photo/favicon_io/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/photo/favicon_io/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/photo/favicon_io/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/photo/favicon_io/site.webmanifest}">
    <link rel="shortcut icon" th:href="@{/photo/favicon_io/favicon.ico}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/home-style.css}">
    <link rel="stylesheet" th:href="@{/style.css}">

    <style>
        .hero-section {
            position: relative;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Kluczowe: wypełnia cały kontener, przycinając nadmiar */
            z-index: -1;
            filter: brightness(0.5); /* Mocniejsze przyciemnienie dla lepszej czytelności */
        }
        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }

        /* ZMIANA: Style dla mini-kafelków w Hero */
        .hero-offer-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
            color: white;
            text-align: left;
            margin: 0 10px; /* Odstęp między kafelkami */
        }
        .hero-offer-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }
        .hero-offer-card img {
            height: 150px;
            width: 100%;
            object-fit: cover;
        }
        .hero-offer-card .card-body {
            padding: 10px;
        }
        .hero-offer-card h5 {
            font-size: 1rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hero-offer-card p {
            font-size: 0.8rem;
            margin-bottom: 0;
            opacity: 0.8;
        }

        /* Style dla karuzeli Hero */
        .hero-carousel .carousel-item {
            height: auto; /* Dostosowanie wysokości */
        }
        .social-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
            height: 100%;
        }
        .social-card:hover {
            transform: translateY(-5px);
        }
        .social-header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: white;
        }
        .fb-header { background-color: #1877f2; }
        .tt-header { background-color: #000000; }
        .yt-header { background-color: #FF0000; }

        .gallery-wrapper {
            position: relative;
            padding: 0 50px;
        }
        .gallery-scroll {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 20px 0;
            scrollbar-width: none;
        }
        .gallery-scroll::-webkit-scrollbar { display: none; }

        .gallery-img-container {
            flex: 0 0 auto;
            width: 300px;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .gallery-img-container:hover {
            transform: scale(1.05);
            z-index: 10;
        }
        .gallery-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s;
            z-index: 20;
        }
        .gallery-nav-btn:hover { background: black; }
        .gallery-nav-btn.left { left: 0; }
        .gallery-nav-btn.right { right: 0; }

        .brands-carousel {
            overflow: hidden;
            position: relative;
            width: 100%;
            padding: 20px 0;
        }
        .brands-track {
            display: flex;
            width: calc(200px * 14);
            animation: scroll 40s linear infinite;
        }
        .brand-logo {
            width: 200px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-logo img {
            max-width: 100%;
            max-height: 60px;
            filter: grayscale(100%);
            opacity: 0.6;
            transition: 0.3s;
        }
        .brand-logo:hover img {
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.1);
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-200px * 7)); } /* 1x liczba marek */
        }
    </style>
</head>
<body>

    <!-- Dynamiczna nawigacja -->
    <div th:replace="~{/public/fragments/navigation :: navbar}"></div>

    <!-- Sekcja Hero (z index.html) -->
    <section class="hero-section px-4 py-5 text-center">
        <video class="hero-video"  autoplay loop muted preload="metadata" playsinline>
            <source src="/photo/konkretFilm1.mp4" type="video/mp4">
            <source src="/photo/konkretFilm1.webm" type="video/webm">
            Twój system nie obsługuje wideo.
        </video>

        <div class="hero-content">
            <div class="linia">
                <a href="/"><img style="width: 90%; height: 90%;" th:src="@{/photo/naklejka_biala1.png}" alt="logo"></a>
            </div>
            <p class="fs-3 fw-bold mt-4 mb-5">Bo auto to nie loteria - wybierz konkret</p>

            <!-- ZMIANA: Karuzela z promowanymi ofertami w Hero -->
            <div id="heroCarousel" class="carousel slide hero-carousel mt-5 pt-2" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <!-- Grupowanie ofert po 3 (dla desktopu) - uproszczona wersja: 1 oferta na slajd dla responsywności -->
                    <!-- Można to rozbudować o JS dla wielu kafelków, ale na start 1 kafelek na środku wygląda elegancko -->
                    <div th:each="offer, iterStat : ${featuredOffers}" class="carousel-item" th:classappend="${iterStat.first ? 'active' : ''}">
                        <div class="d-flex justify-content-center pt-2">
                            <a th:href="@{/offers/{id}(id=${offer.id})}" class="text-decoration-none" style="width: 300px;">
                                <div class="hero-offer-card">
                                    <th:block th:with="mainImage=${offer.getMainImage().orElse(null)}">
                                        <img th:if="${mainImage != null}" th:src="@{'/car_photo/' + ${mainImage.fileName}}" alt="Auto">
                                        <img th:if="${mainImage == null}" th:src="@{${@systemSettingService.getDefaultOfferImageUrl()}}" alt="Auto">
                                    </th:block>
                                    <div class="card-body">
                                        <h5 th:text="${offer.brand?.nazwaMarki + ' ' + offer.model?.model}">Marka Model</h5>
                                        <p>
                                            <span th:text="${offer.rok}">2020</span> &bull;
                                            <span th:text="${@priceFormatter.print(offer.cena, #locale)}">100 000 PLN</span>
                                        </p>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Poprzedni</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Następny</span>
                </button>
            </div>
            <div class="mt-4">
                <a th:href="@{/offers}" class="btn btn-primary btn-lg px-5 py-3 gap-3 fw-bold" role="button">Zobacz wszystkie oferty</a>
            </div>
        </div>
    </section>
    <section class="featured-offers py-5 content bg-light">
        <div class="container">
            <div class="row g-4">
                <div th:each="offer : ${featuredOffers}" class="col-md-6 col-lg-4">
                    <div class="card offer-card h-100 border shadow-sm"
                         th:classappend="${offer.status?.name() == 'DOSTĘPNY'} ? 'border-primary' : (${offer.status?.name() == 'ZAREZERWOWANY'} ? 'border-warning' : 'border-secondary')">
                        <div class="card-img-container position-relative overflow-hidden" style="height: 250px;">
                            <th:block th:with="mainImage=${offer.getMainImage().orElse(null)}">
                                <img th:if="${mainImage != null}" th:src="@{/car_photo/{fileName}(fileName=${mainImage.fileName})}" class="card-img-top w-100 h-100 object-fit-cover" alt="Zdjęcie samochodu" loading="lazy">
                                <img th:if="${mainImage == null}" th:src="@{${@systemSettingService.getDefaultOfferImageUrl()}}" class="card-img-top w-100 h-100 object-fit-cover" alt="Brak zdjęcia" loading="lazy">
                            </th:block>
                            <div th:if="${offer.status?.name() == 'ZAREZERWOWANY' or offer.status?.name() == 'SPRZEDANY' or offer.status?.name() == 'WKROTCE'}" class="status-overlay position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-dark bg-opacity-50 text-white fw-bold fs-4" th:text="${offer.status.displayName}"></div>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold" th:text="${offer.brand?.nazwaMarki + ' ' + offer.model?.model}"></h5>
                            <p class="card-text fw-bold text-primary mb-1" th:if="${offer.naglowek != null and !offer.naglowek.isEmpty()}" th:text="${offer.naglowek}"></p>
                            <p class="card-text text-muted small mb-3">
                                <span th:text="${@yearFormatter.print(offer.rok, #locale)}"></span> &bull;
                                <span th:text="${@mileageFormatter.print(offer.przebieg, #locale)}"></span> &bull;
                                <span th:if="${offer.pojemonscSilnika != null}" th:text="${offer.pojemonscSilnika}"></span> &bull;
                                <span th:if="${offer.skrzyniaBiegow != null}" th:text="${offer.skrzyniaBiegow.displayName}"></span> &bull;
                                <span th:if="${offer.rodzajPaliwa != null}" th:text="${offer.rodzajPaliwa.displayName}"></span>
                            </p>
                            <div class="mt-auto">
                                <th:block th:if="${offer.status?.name() == 'SPRZEDANY'}">
                                    <h6 class="price text-danger fw-bold mb-3">Sprzedany</h6>
                                </th:block>
                                <th:block th:unless="${offer.status?.name() == 'SPRZEDANY'}">
                                    <h6 class="price fw-bold mb-3" th:text="${@priceFormatter.print(offer.cena, #locale)}"></h6>
                                </th:block>
                                <a th:href="@{/offers/{id}(id=${offer.id})}" class="btn btn-offer btn-outline-primary stretched-link w-100">Zobacz Szczegóły</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sekcja kategorii -->
            <!--            <div class="row mt-5 text-center g-4">-->
            <!--                <div class="col-md-4">-->
            <!--                    <div class="p-4 border rounded bg-white h-100 shadow-sm">-->
            <!--                        <h4>SUV</h4>-->
            <!--                        <p class="text-muted">Przestrzeń, komfort, bezpieczeństwo.</p>-->
            <!--                    </div>-->
            <!--                </div>-->
            <!--                <div class="col-md-4">-->
            <!--                    <div class="p-4 border rounded bg-white h-100 shadow-sm">-->
            <!--                        <h4>Sportowe</h4>-->
            <!--                        <p class="text-muted">Maksymalna moc i emocje za kierownicą.</p>-->
            <!--                    </div>-->
            <!--                </div>-->
            <!--                <div class="col-md-4">-->
            <!--                    <div class="p-4 border rounded bg-white h-100 shadow-sm">-->
            <!--                        <h4>Miejskie</h4>-->
            <!--                        <p class="text-muted">Idealne do codziennej jazdy w mieście.</p>-->
            <!--                    </div>-->
            <!--                </div>-->
            <!--            </div>-->
        </div>
    </section>

    <!-- Sekcja Social Media -->
    <section class="py-5 bg-light">
        <div class="container">
            <h2 class="text-center mb-5 display-5 fw-bold">Dołącz do nas</h2>
            <div class="row justify-content-center g-4">
                <div class="col-lg-4 col-md-6">
                    <div class="social-card">
                        <div class="social-header fb-header">
                            <i class="fab fa-facebook fa-lg me-2"></i> Facebook
                        </div>
                        <div class="d-flex justify-content-center p-3">
                            <iframe src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Fkonkretnefury&tabs=timeline&width=340&height=500&small_header=false&adapt_container_width=true&hide_cover=false&show_facepile=true&appId" width="340" height="500" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" loading="lazy"></iframe>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6">
                    <div class="social-card text-center d-flex flex-column">
                        <div class="social-header tt-header">
                            <i class="fab fa-tiktok fa-lg me-2"></i> TikTok
                        </div>
                        <div class="d-flex justify-content-center p-3">
                            <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@konkretnefury" data-unique-id="konkretnefury" data-embed-from="embed_page" data-embed-type="creator"> <section> <a target="_blank" href="https://www.tiktok.com/@konkretnefury?refer=creator_embed">@konkretnefury</a> </section> </blockquote> <script async src="https://www.tiktok.com/embed.js"></script>
<!--                        <div class="card-body d-flex flex-column justify-content-center align-items-center p-4">-->
<!--                            <h5 class="card-title">@konkretnefury</h5>-->
<!--                            <p class="card-text text-muted">Zobacz nasze najnowsze realizacje i ciekawostki motoryzacyjne!</p>-->
<!--                            <a href="https://www.tiktok.com/@konkretnefury" target="_blank" class="btn btn-dark mt-auto">-->
<!--                                <i class="fab fa-tiktok me-2"></i> Obserwuj na TikToku-->
<!--                            </a>-->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ZMIANA: Galeria dynamiczna -->
    <section class="py-5">
        <div class="container">
            <h2 class="text-center mb-5 display-5 fw-bold">Galeria</h2>
            <div class="gallery-wrapper">
                <button class="gallery-nav-btn left" onclick="scrollGallery(-1)"><i class="fas fa-chevron-left"></i></button>
                <div class="gallery-scroll" id="galleryScroll">
                    <div th:each="imageUrl : ${galleryImages}" class="gallery-img-container" onclick="openModal(this)">
                        <img th:src="@{${imageUrl}}" alt="Image 1" loading="lazy">
                    </div>
                    <div th:if="${galleryImages.empty}" class="text-center w-100 p-5">
                        <p class="lead text-muted">Galeria jest obecnie pusta.</p>
                    </div>
                </div>
                <button class="gallery-nav-btn right" onclick="scrollGallery(1)"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </section>

    <section class="py-4 border-bottom border-top">
        <div class="container">
            <div class="brands-carousel">
                <div class="brands-track">
                    <!-- Podwójna pętla dla płynnego przewijania -->
                    <div th:each="brand : ${brands}" class="brand-logo">
                        <img th:if="${brand.iconUrl}" th:src="@{${brand.iconUrl}}" th:alt="${brand.nazwaMarki}">
                    </div>
                    <div th:each="brand : ${brands}" class="brand-logo">
                        <img th:if="${brand.iconUrl}" th:src="@{${brand.iconUrl}}" th:alt="${brand.nazwaMarki}">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body p-0 text-center position-relative">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
                    <img id="lightboxImage" src="" class="img-fluid rounded" alt="Powiększone zdjęcie">
                </div>
            </div>
        </div>
    </div>

    <!-- Dynamiczna stopka -->
    <div th:replace="~{/public/fragments/footer :: footer}"></div>

    <!-- Skrypty -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script th:src="@{/script.js(v='1.0')}"></script>
    <script th:src="@{/index.js(v='1.0')}"></script>

    <script>
        function scrollGallery(direction) {
            const gallery = document.getElementById('galleryScroll');
            const scrollAmount = 320; // Szerokość zdjęcia + gap
            gallery.scrollBy({
                left: direction * scrollAmount,
                behavior: 'smooth'
            });
        }

        function openModal(element) {
            const modalElement = document.getElementById('lightboxModal');
            const modalImg = document.getElementById('lightboxImage');
            const modal = new bootstrap.Modal(modalElement);

            const img = element.querySelector('img');
            modalImg.src = img.src;
            modal.show();
        }
    </script>
</body>
</html>
