<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Zdjęć - AutoKonkret</title>
    <meta name="author" content="Mateusz Kołecki">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        /* ZMIANA: Masonry Layout za pomocą CSS Columns */
        .gallery-masonry {
            column-count: 1; /* Domyślnie 1 kolumna (mobilki) */
            column-gap: 15px;
        }

        /* Responsywność */
        @media (min-width: 576px) {
            .gallery-masonry { column-count: 2; }
        }
        @media (min-width: 768px) {
            .gallery-masonry { column-count: 3; }
        }
        @media (min-width: 1200px) {
            .gallery-masonry { column-count: 4; }
        }

        .gallery-item {
            break-inside: avoid; /* Zapobiega łamaniu zdjęcia między kolumnami */
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Styl dla modala */
        .img-modal {
            display: none;
            position: fixed;
            z-index: 1050;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.9);
        }
        .modal-content-wrapper {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 1200px;
            position: relative;
        }
        .img-modal-content {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .close {
            position: absolute;
            top: -40px;
            right: 0;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }
        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- Dynamiczna nawigacja -->
        <div th:replace="~{public/fragments/navigation :: navbar}"></div>

        <main class="container my-5">
            <h1 class="text-center mb-5 display-4">Nasza Galeria</h1>

            <div class="gallery-masonry">
                <!-- Pętla Thymeleaf -->
                <div th:each="imageUrl : ${galleryImages}" class="gallery-item" onclick="openModal(this)">
                    <img th:src="@{${imageUrl}}" alt="Zdjęcie z galerii" loading="lazy">
                </div>
            </div>

            <!-- Fallback jeśli folder jest pusty -->
            <div th:if="${galleryImages.empty}" class="text-center w-100 p-5">
                <p class="lead text-muted">Galeria jest obecnie pusta. Zapraszamy wkrótce!</p>
            </div>
        </main>

        <!-- Dynamiczna stopka -->
        <div th:replace="~{public/fragments/footer :: footer}"></div>
    </div>

    <!-- Modal do podglądu zdjęć -->
    <div id="imgModal" class="img-modal" onclick="closeModal()">
        <div class="modal-content-wrapper">
          <span class="close" onclick="event.stopPropagation(); closeModal()">&times;</span>
          <img class="img-modal-content" id="modalImage" alt="Podgląd zdjęcia" onclick="event.stopPropagation()">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/script.js}"></script>

    <script>
        function openModal(element) {
            var modal = document.getElementById("imgModal");
            var modalImg = document.getElementById("modalImage");
            // Pobieramy src z obrazka wewnątrz klikniętego diva
            var img = element.querySelector('img');
            modal.style.display = "block";
            modalImg.src = img.src;
        }

        function closeModal() {
            var modal = document.getElementById("imgModal");
            modal.style.display = "none";
        }

        // Obsługa klawisza ESC
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeModal();
            }
        });
    </script>
</body>
</html>
