<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mateusz Kołecki">
    <title>Aktualności - AutoKonkret</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Twoje style -->
    <link rel="stylesheet" th:href="@{/style.css}">

    <style>
        .blog-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .blog-date {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 0.5rem;
        }
        .blog-author {
            font-size: 0.85rem;
            color: #0d6efd;
            font-weight: 600;
        }
        .blog-content-preview {
            color: #495057;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .hero-blog {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('/photo/blog-bg.jpg'); /* Możesz dodać tło */
            background-size: cover;
            background-position: center;
            color: white;
            padding: 100px 0;
            margin-bottom: 50px;
            border-radius: 0 0 20px 20px;
        }
        /* Fallback jeśli nie ma zdjęcia tła */
        .hero-blog {
            background-color: #212529;
        }
    </style>
</head>
<body>

    <!-- Dynamiczna nawigacja -->
    <div th:replace="~{public/fragments/navigation :: navbar}"></div>

    <!-- Sekcja Hero -->
    <header class="hero-blog text-center">
        <div class="container">
            <h1 class="display-3 fw-bold">Aktualności</h1>
            <p class="lead">Najnowsze informacje ze świata motoryzacji i życia naszej firmy.</p>
        </div>
    </header>

    <main class="container mb-5">
        <div class="row g-4">
            <!-- Pętla po wpisach -->
            <div th:each="post : ${posts}" class="col-md-6 col-lg-4">
                <article class="card blog-card h-100">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="blog-date">
                                <i class="far fa-calendar-alt me-1"></i>
                                <span th:text="${#temporals.format(post.dataPublikacji, 'dd.MM.yyyy')}">Data</span>
                            </span>
                            <span class="blog-author" th:text="${post.autor}">Autor</span>
                        </div>

                        <h3 class="card-title h4 mb-3">
                            <a th:href="@{/blog/{id}(id=${post.id})}" class="text-decoration-none text-dark stretched-link" th:text="${post.tytul}">Tytuł wpisu</a>
                        </h3>

                        <p class="card-text blog-content-preview" th:text="${post.tresc}">
                            Treść wpisu...
                        </p>

                        <div class="mt-auto pt-3 border-top">
                            <span class="text-primary fw-bold">Czytaj więcej &rarr;</span>
                        </div>
                    </div>
                </article>
            </div>

            <!-- Komunikat gdy brak wpisów -->
            <div th:if="${posts.empty}" class="col-12 text-center py-5">
                <div class="alert alert-light" role="alert">
                    <h4 class="alert-heading">Brak wpisów</h4>
                    <p>W tej chwili nie ma żadnych aktualności. Zajrzyj do nas wkrótce!</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Dynamiczna stopka -->
    <div th:replace="~{public/fragments/footer :: footer}"></div>

    <!-- Skrypty -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome dla ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</body>
</html>
