<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mateusz Kołecki">
    <title th:text="${post.tytul} + ' - AutoKonkret'">Tytuł wpisu</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Twoje style -->
    <link rel="stylesheet" th:href="@{/style.css}">

    <style>
        .blog-post-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #333;
            white-space: pre-line; /* Zachowuje akapity z pola tekstowego */
        }
        .blog-meta {
            font-size: 0.9rem;
            color: #6c757d;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .hero-blog-post {
            background-color: #212529;
            color: white;
            padding: 80px 0;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <!-- Dynamiczna nawigacja -->
    <div th:replace="~{public/fragments/navigation :: navbar}"></div>

    <!-- Sekcja Hero z tytułem -->
    <header class="hero-blog-post text-center">
        <div class="container">
            <h1 class="display-4 fw-bold" th:text="${post.tytul}">Tytuł wpisu</h1>
        </div>
    </header>

    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <article>
                    <!-- Metadane wpisu -->
                    <div class="blog-meta d-flex justify-content-between align-items-center">
                        <span>
                            <i class="far fa-calendar-alt me-2"></i>
                            <span th:text="${#temporals.format(post.dataPublikacji, 'dd MMMM yyyy')}">Data</span>
                        </span>
                        <span>
                            <i class="far fa-user me-2"></i>
                            <span th:text="${post.autor}">Autor</span>
                        </span>
                    </div>

                    <!-- Treść wpisu -->
                    <div class="blog-post-content" th:text="${post.tresc}">
                        Treść wpisu...
                    </div>
                </article>

                <!-- Przycisk powrotu -->
                <div class="mt-5 text-center">
                    <a th:href="@{/blog}" class="btn btn-outline-primary">
                        <i class="fas fa-arrow-left me-2"></i> Wróć do aktualności
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Dynamiczna stopka -->
    <div th:replace="~{public/fragments/footer :: footer}"></div>

    <!-- Skrypty -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
