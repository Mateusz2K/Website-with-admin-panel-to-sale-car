<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj / Edytuj Wpis Blogowy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">

    <!-- TinyMCE -->
    <script src="https://cdn.tiny.cloud/1/ntgt444ru8d461bxwc0s7yfskamsj7sh3pihx9vcf90d941t/tinymce/8/tinymce.min.js" referrerpolicy="origin" crossorigin="anonymous"></script>    <script>
        document.addEventListener('DOMContentLoaded', function() {
            tinymce.init({
                selector: 'textarea#content', // Celuje w textarea z ID 'content'
                plugins: 'advlist autolink lists link image charmap print preview anchor ' +
                         'searchreplace visualblocks code fullscreen insertdatetime media table paste code help wordcount',
                toolbar: 'undo redo | formatselect | bold italic backcolor | ' +
                         'alignleft aligncenter alignright alignjustify | ' +
                         'bullist numlist outdent indent | removeformat | image media | help',
                height: 500, // Wysokość edytora
                menubar: 'file edit view insert format tools table help',

                // Konfiguracja uploadu obrazków dla TinyMCE
                images_upload_url: '/admin/upload/image', // Nasz endpoint do uploadu obrazków
                automatic_uploads: true,
                images_file_types: 'jpeg,jpg,png,gif',
                relative_urls: false, // Ważne, aby ścieżki do obrazków były absolutne
                remove_script_host: false,
                convert_urls: false,
                uploadcare_public_key: '952b7f50f4788767d16c'

            });
        });
    </script>
</head>
<body>

<div th:replace="~{admin/fragments/navigation :: navbar}"></div>

<main class="container mt-4">
    <div class="form-container">
        <h1 class="h2 mb-4" th:text="${blogPost.id == null ? 'Dodaj Nowy Wpis Blogowy' : 'Edytuj Wpis Blogowy'}">Tytuł</h1>

        <form th:action="@{/admin/blog}" th:object="${blogPost}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label for="title" class="form-label">Tytuł</label>
                <input type="text" id="title" class="form-control" th:field="*{tytul}" required>
            </div>

            <div class="mb-3">
                <label for="content" class="form-label">Treść</label>
                <!-- Ważne: ID textarea musi być zgodne z selektorem TinyMCE -->
                <textarea id="content" class="form-control" rows="15" th:field="*{tresc}"></textarea>
            </div>

            <div class="mb-3">
                <label for="author" class="form-label">Autor</label>
                <input type="text" id="author" class="form-control" th:field="*{autor}" required>
            </div>

            <hr>

            <button type="submit" class="btn btn-primary">Zapisz Wpis</button>
            <a th:href="@{/admin/blog}" class="btn btn-secondary">Anuluj</a>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
