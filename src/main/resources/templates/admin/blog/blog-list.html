<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarządzanie Wpisami Blogowymi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
</head>
<body>

<div th:replace="~{admin/fragments/navigation :: navbar}"></div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2">Zarządzanie Wpisami Blogowymi</h1>
        <a th:href="@{/admin/blog/new}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Dodaj Nowy Wpis
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Tytuł</th>
                <th>Autor</th>
                <th>Data Publikacji</th>
                <th class="text-center">Akcje</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="post : ${posts}">
                <td th:text="${post.tytul}"></td>
                <td th:text="${post.autor}"></td>
                <td th:text="${#temporals.format(post.dataPublikacji, 'dd-MM-yyyy')}"></td>
                <td class="text-center">
                    <a th:href="@{/admin/blog/edit/{id}(id=${post.id})}" class="btn btn-sm btn-warning btn-action" title="Edytuj">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a th:href="@{/admin/blog/delete/{id}(id=${post.id})}" class="btn btn-sm btn-danger btn-action"
                       onclick="return confirm('Czy na pewno chcesz usunąć ten wpis?');" title="Usuń">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${posts.isEmpty()}">
                <td colspan="4" class="text-center p-4">Brak wpisów do wyświetlenia.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
