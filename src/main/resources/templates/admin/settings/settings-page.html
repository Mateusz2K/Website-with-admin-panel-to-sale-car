<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ustawienia Strony</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
</head>
<body>
<div th:replace="~{admin/fragments/navigation :: navbar}"></div>
<main class="container mt-4">
    <h1 class="h2 mb-4">Ustawienia Strony</h1>
    <div class="form-container">
        <h3 class="h5">Domyślna grafika dla ofert</h3>
        <p>Ta grafika będzie wyświetlana, gdy oferta nie ma żadnych zdjęć.</p>

        <div class="mb-3">
            <p><strong>Aktualny podgląd:</strong></p>
            <img th:src="@{${defaultOfferImageUrl}}" alt="Domyślna grafika" style="max-width: 300px; border: 1px solid #ddd; padding: 5px;">
        </div>

        <form th:action="@{/admin/settings/upload-default-image}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="defaultImage" class="form-label">Wgraj nową grafikę</label>
                <input type="file" class="form-control" id="defaultImage" name="defaultImage" required>
            </div>
            <button type="submit" class="btn btn-primary">Zapisz</button>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
