<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zarządzanie Ofertami</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
</head>
<body>
<div th:replace="~{admin/fragments/navigation :: navbar}"></div>
<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2">Zarządzanie Ofertami</h1>
        <a th:href="@{/admin/offers/new}" class="btn btn-primary"><i class="fas fa-plus"></i> Dodaj Nową Ofertę</a>
    </div>

    <form th:action="@{/admin/offers}" th:object="${filters}" method="get" class="row g-3 mb-4 p-3 bg-light rounded border">
        <div class="col-md-3"><label for="brandId" class="form-label">Marka</label><select id="brandId" class="form-select" th:field="*{brandId}"><option value="">Wszystkie</option><option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.nazwaMarki}"></option></select></div>
        <div class="col-md-2"><label for="priceFrom" class="form-label">Cena od</label><input type="number" id="priceFrom" class="form-control" th:field="*{priceFrom}"></div>
        <div class="col-md-2"><label for="priceTo" class="form-label">Cena do</label><input type="number" id="priceTo" class="form-control" th:field="*{priceTo}"></div>
        <div class="col-md-2"><label for="yearFrom" class="form-label">Rok produkcji od</label><input type="number" id="yearFrom" class="form-control" th:field="*{yearFrom}"></div>
        <div class="col-md-2"><label for="yearTo" class="form-label">Rok produkcji do</label><input type="number" id="yearTo" class="form-control" th:field="*{yearTo}"></div>
        <div class="col-md-1 d-flex align-items-end"><button type="submit" class="btn btn-primary w-100">Filtruj</button></div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark"><tr><th>Marka i Model</th><th>Rok prdukcji</th><th>Cena</th><th>Status</th><th class="text-center">Promowana</th><th class="text-center">Akcje</th></tr></thead>
            <tbody>
            <!-- ZMIANA: Pętla iteruje po offersPage.content -->
            <tr th:each="offer : ${offersPage.content}">
                <td th:text="${offer.brand?.nazwaMarki + ' ' + offer.model?.model}"></td>
                <td th:text="${offer.rok}"></td>
                <td th:text="${#numbers.formatDecimal(offer.cena, 0, 'POINT', 2, 'COMMA')} + ' PLN'"></td>
                <td>
                    <form th:action="@{/admin/offers/status/{id}(id=${offer.id})}" method="post" class="d-flex">
                        <select name="status" class="form-select form-select-sm" onchange="this.form.submit()"><option th:each="s : ${T(pl.konkretnefury.konkretnefury.modele.StatusOfCar).values()}" th:value="${s}" th:text="${s.displayName}" th:selected="${s == offer.status}"></option></select>
                    </form>
                </td>
                <td class="text-center"><a th:href="@{/admin/offers/toggle-featured/{id}(id=${offer.id})}" class="btn btn-sm" th:classappend="${offer.isFeatured ? 'btn-success' : 'btn-outline-secondary'}"><i th:class="${offer.isFeatured ? 'fas fa-star' : 'far fa-star'}"></i></a></td>
                <td class="text-center">
                    <a th:href="@{/offers/{id}(id=${offer.id})}" target="_blank" class="btn btn-sm btn-info btn-action" title="Podgląd"><i class="fas fa-eye"></i></a>
                    <a th:href="@{/admin/offers/edit/{id}(id=${offer.id})}" class="btn btn-sm btn-warning btn-action" title="Edytuj"><i class="fas fa-edit"></i></a>
                    <a th:href="@{/admin/offers/delete/{id}(id=${offer.id})}" class="btn btn-sm btn-danger btn-action" onclick="return confirm('Czy na pewno chcesz usunąć tę ofertę?');" title="Usuń"><i class="fas fa-trash"></i></a>
                </td>
            </tr>
            <tr th:if="${offersPage.empty}"><td colspan="6" class="text-center p-4">Brak ofert spełniających podane kryteria.</td></tr>
            </tbody>
        </table>
    </div>

    <!-- NOWY KOMPONENT PAGINACJI -->
    <nav th:if="${offersPage.totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${offersPage.first} ? 'disabled'"><a class="page-link" th:href="@{/admin/offers(page=${offersPage.number - 1},brandId=${filters.brandId})}">Poprzednia</a></li>
            <li th:each="i : ${#numbers.sequence(0, offersPage.totalPages - 1)}" class="page-item" th:classappend="${i == offersPage.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/offers(page=${i},brandId=${filters.brandId})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${offersPage.last} ? 'disabled'"><a class="page-link" th:href="@{/admin/offers(page=${offersPage.number + 1},brandId=${filters.brandId})}">Następna</a></li>
        </ul>
    </nav>
    
    <a th:href="@{/admin}" class="btn btn-secondary mt-3">&larr; Wróć do pulpitu</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
