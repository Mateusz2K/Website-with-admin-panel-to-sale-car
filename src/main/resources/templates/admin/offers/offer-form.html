<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Zarządzaj Ofertą</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- ZMIANA: Dodano CSS Summernote -->
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:replace="~{admin/fragments/navigation :: navbar}"></div>
<main class="container mt-4">
    <div class="form-container">
        <h1 class="h2 mb-4" th:text="${offer.id == null ? 'Dodaj Nową Ofertę' : 'Edytuj Ofertę'}"></h1>
        <form th:action="@{/admin/offers}" th:object="${offer}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}"/>

            <div th:if="${offer.id != null}" class="mb-5">
                <h3 class="h4">Zarządzaj Zdjęciami</h3>
                <div id="imageCarousel" class="carousel slide" data-bs-interval="false">
                    <div class="carousel-inner">
                        <div th:if="${offer.zdjęcia.isEmpty()}" class="carousel-item active"><div class="d-flex justify-content-center align-items-center bg-light" style="height: 400px;"><span>Brak zdjęć</span></div></div>
                        <div th:each="image, iterStat : ${offer.zdjęcia}" class="carousel-item" th:classappend="${iterStat.first ? 'active' : ''}" th:data-image-id="${image.id}">
                            <img th:src="@{/car_photo/{fileName}(fileName=${image.fileName})}" class="d-block w-100" style="height: 400px; object-fit: contain;">
                            <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2">
                                <button type="button" class="btn btn-sm btn-primary" th:classappend="${image.isMain ? 'disabled' : ''}" onclick="setMainImage(this)"><i class="fas fa-star"></i> Ustaw jako główne</button>
                                <button type="button" class="btn btn-sm btn-danger" onclick="deleteImage(this)"><i class="fas fa-trash"></i> Usuń</button>
                                <p th:if="${image.isMain}" class="mt-2 mb-0"><span class="badge bg-success">Zdjęcie główne</span></p>
                            </div>
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#imageCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                    <button class="carousel-control-next" type="button" data-bs-target="#imageCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
                </div>
            </div>

            <div class="mb-4">
                <label for="images" class="form-label">Dodaj nowe zdjęcia</label>
                <input class="form-control" type="file" id="images" name="images" multiple>
            </div>
            <hr>

            <div class="row">
                <div class="col-md-6 mb-3"><label for="brand" class="form-label">Marka</label><select id="brand" class="form-select" th:field="*{brand}" required><option value="">-- Wybierz --</option><option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.nazwaMarki}"></option></select></div>
                <div class="col-md-6 mb-3"><label for="model" class="form-label">Model</label><select id="model" class="form-select" th:field="*{model}" required disabled><option th:if="${offer.model != null}" th:value="${offer.model.id}" th:text="${offer.model.model}" selected></option></select></div>
            </div>
            <div class="mb-3">
                <label for="naglowek" class="form-label">Nagłówek oferty (opcjonalny)</label>
                <input type="text" id="naglowek" class="form-control" th:field="*{naglowek}" placeholder="np. Idealny stan, pierwszy właściciel!">
            </div>
            <div class="row">
                <div class="col-md-4 mb-3"><label for="rok" class="form-label">Rok</label><input type="number" id="rok" class="form-control" th:field="*{rok}" required></div>
                <div class="col-md-4 mb-3"><label for="cena" class="form-label">Cena (PLN)</label><input type="number" step="0.01" id="cena" class="form-control" th:field="*{cena}" required></div>
                <div class="col-md-4 mb-3"><label for="przebieg" class="form-label">Przebieg</label><input type="number" id="przebieg" class="form-control" th:field="*{przebieg}" required></div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3"><label for="pojemonscSilnika" class="form-label">Pojemność (cm³)</label><input type="number" id="pojemonscSilnika" class="form-control" th:field="*{pojemonscSilnika}" required></div>
                <div class="col-md-4 mb-3"><label for="moc" class="form-label">Moc (KM)</label><input type="number" id="moc" class="form-control" th:field="*{moc}" required></div>
                <div class="col-md-4 mb-3"><label for="rodzajPaliwa" class="form-label">Paliwo</label><select id="rodzajPaliwa" class="form-select" th:field="*{rodzajPaliwa}" required><option value="">-- Wybierz --</option><option th:each="paliwo : ${T(pl.konkretnefury.konkretnefury.modele.RodzajPaliwa).values()}" th:value="${paliwo}" th:text="${paliwo.displayName}"></option></select></div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3"><label for="typPojazdu" class="form-label">Typ pojazdu</label><select id="typPojazdu" class="form-select" th:field="*{typPojazdu}" onchange="toggleNadwozie()"><option value="">-- Wybierz --</option><option th:each="t : ${T(pl.konkretnefury.konkretnefury.modele.TypPojazdu).values()}" th:value="${t}" th:text="${t.displayName}"></option></select></div>
                <div class="col-md-4 mb-3" id="nadwozieOsoboweContainer"><label for="rodzajNadwozia" class="form-label">Nadwozie (Osobowe)</label><select id="rodzajNadwozia" class="form-select" th:field="*{rodzajNadwozia}"><option value="">-- Wybierz --</option><option th:each="nadwozie : ${T(pl.konkretnefury.konkretnefury.modele.RodzajNadwozia).values()}" th:value="${nadwozie}" th:text="${nadwozie.displayName}"></option></select></div>
                <div class="col-md-4 mb-3" id="nadwozieCiezaroweContainer" style="display: none;"><label for="rodzajNadwoziaCiezarowe" class="form-label">Nadwozie (Ciężarowe)</label><select id="rodzajNadwoziaCiezarowe" class="form-select" th:field="*{rodzajNadwoziaCiezarowe}"><option value="">-- Wybierz --</option><option th:each="nadwozie : ${T(pl.konkretnefury.konkretnefury.modele.RodzajNadwoziaCiezarowe).values()}" th:value="${nadwozie}" th:text="${nadwozie.displayName}"></option></select></div>
                <div class="col-md-4 mb-3"><label for="kolor" class="form-label">Kolor</label><input type="text" id="kolor" class="form-control" th:field="*{kolor}"></div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3"><label for="naped" class="form-label">Napęd</label><select id="naped" class="form-select" th:field="*{naped}"><option value="">-- Wybierz --</option><option th:each="n : ${T(pl.konkretnefury.konkretnefury.modele.Naped).values()}" th:value="${n}" th:text="${n.displayName}"></option></select></div>
                <div class="col-md-4 mb-3"><label for="skrzyniaBiegow" class="form-label">Skrzynia biegów</label><select id="skrzyniaBiegow" class="form-select" th:field="*{skrzyniaBiegow}"><option value="">-- Wybierz --</option><option th:each="s : ${T(pl.konkretnefury.konkretnefury.modele.SkrzyniaBiegow).values()}" th:value="${s}" th:text="${s.displayName}"></option></select></div>
                <!-- ZMIANA: Pole tekstowe zastąpione listą rozwijaną -->
                <div class="col-md-4 mb-3"><label for="krajPochodzenia" class="form-label">Kraj pochodzenia</label><select id="krajPochodzenia" class="form-select" th:field="*{krajPochodzenia}"><option value="">-- Wybierz --</option><option th:each="kraj : ${T(pl.konkretnefury.konkretnefury.modele.KrajPochodzenia).values()}" th:value="${kraj}" th:text="${kraj.displayName}"></option></select></div>
            </div>
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="gwarancjaCheck" onchange="toggleGwarancjaOpis()">
                    <label class="form-check-label" for="gwarancjaCheck">Dodaj opis gwarancji</label>
                </div>
                <div id="gwarancjaOpisContainer" style="display: none;" class="mt-2">
                    <label for="gwarancjaOpis" class="form-label">Szczegóły gwarancji</label>
                    <!-- ZMIANA: Dodano klasę summernote -->
                    <textarea id="gwarancjaOpis" class="form-control summernote" th:field="*{gwarancjaOpis}" rows="2"></textarea>
                </div>
            </div>
            <div class="mb-3">
                <label for="opis" class="form-label">Opis</label>
                <!-- ZMIANA: Dodano klasę summernote -->
                <textarea id="opis" class="form-control summernote" rows="5" th:field="*{opis}"></textarea>
            </div>
            <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="isFeatured" th:field="*{featured}"><label class="form-check-label" for="isFeatured"><strong>Oznacz jako promowana</strong></label></div>

            <hr><h3 class="h4 mt-4 mb-3">Wyposażenie</h3>
            <div class="row">
                <div th:each="category : ${T(pl.konkretnefury.konkretnefury.modele.TypeOfCarOptions).values()}" class="col-md-4 mb-3">
                    <h5><span th:text="${category.displayName}"></span></h5>
                    <div th:each="option : ${allOptions}" th:if="${option.category == category}" class="form-check">
                        <input class="form-check-input" type="checkbox" th:field="*{options}" th:value="${option.id}" th:id="${'option-' + option.id}">
                        <label class="form-check-label" th:for="${'option-' + option.id}" th:text="${option.name}"></label>
                    </div>
                </div>
            </div>

            <hr>
            <button type="submit" class="btn btn-primary">Zapisz</button>
            <a th:href="@{/admin/offers}" class="btn btn-secondary">Anuluj</a>
        </form>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- ZMIANA: Dodano JS Summernote -->
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/lang/summernote-pl-PL.min.js"></script>

<script>
    // ZMIANA: Inicjalizacja Summernote
    $(document).ready(function() {
        $('.summernote').summernote({
            placeholder: 'Wpisz treść...',
            tabsize: 2,
            height: 200,
            lang: 'pl-PL',
            toolbar: [
                ['style', ['style']],
                ['font', ['bold', 'underline', 'clear']],
                ['color', ['color']],
                ['para', ['ul', 'ol', 'paragraph']],
                ['table', ['table']],
                ['insert', ['link']],
                ['view', ['fullscreen', 'codeview', 'help']]
            ]
        });
    });

    document.addEventListener('DOMContentLoaded', function () {
        const brandSelect = document.getElementById('brand');
        const modelSelect = document.getElementById('model');
        const selectedModelId = modelSelect.value; // Przechowaj wybrane ID przy edycji

        function fetchModels(brandId) {
            if (!brandId) {
                modelSelect.innerHTML = '<option value="">-- Najpierw wybierz markę --</option>';
                modelSelect.disabled = true;
                return;
            }
            fetch(`/api/models/by-brand/${brandId}`)
                .then(response => response.json())
                .then(data => {
                    modelSelect.innerHTML = '<option value="">-- Wybierz model --</option>';
                    data.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.id;
                        option.textContent = model.name;
                        modelSelect.appendChild(option);
                    });
                    modelSelect.disabled = false;
                    // Jeśli edytujemy, przywróć wybrany model
                    if (selectedModelId) {
                        modelSelect.value = selectedModelId;
                    }
                })
                .catch(error => {
                    console.error('Błąd podczas pobierania modeli:', error);
                    modelSelect.innerHTML = '<option value="">Błąd ładowania modeli</option>';
                    modelSelect.disabled = true;
                });
        }

        brandSelect.addEventListener('change', function () {
            fetchModels(this.value);
        });

        if (brandSelect.value) {
            fetchModels(brandSelect.value);
        }

        const textarea = document.getElementById('gwarancjaOpis');
        if (textarea.value) {
            document.getElementById('gwarancjaCheck').checked = true;
            toggleGwarancjaOpis();
        }

        // ZMIANA: Inicjalizacja stanu nadwozia
        toggleNadwozie();
    });

    function setMainImage(button) {
        const imageId = button.closest('.carousel-item').dataset.imageId;
        const token = document.querySelector("meta[name='_csrf']").getAttribute("content");
        const header = document.querySelector("meta[name='_csrf_header']").getAttribute("content");

        fetch(`/api/images/set-main/${imageId}`, {
            method: 'POST',
            headers: {
                [header]: token
            }
        }).then(() => window.location.reload());
    }

    function deleteImage(button) {
        if (confirm('Czy na pewno chcesz usunąć to zdjęcie?')) {
            const imageId = button.closest('.carousel-item').dataset.imageId;
            const token = document.querySelector("meta[name='_csrf']").getAttribute("content");
            const header = document.querySelector("meta[name='_csrf_header']").getAttribute("content");

            fetch(`/api/images/delete/${imageId}`, {
                method: 'DELETE',
                headers: {
                    [header]: token
                }
            }).then(() => window.location.reload());
        }
    }
    function toggleGwarancjaOpis() {
        const container = document.getElementById('gwarancjaOpisContainer');
        const checkbox = document.getElementById('gwarancjaCheck');
        const textarea = document.getElementById('gwarancjaOpis');
        if (checkbox.checked) {
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
            textarea.value = '';
            // Jeśli Summernote jest aktywny, wyczyść go też
            if ($(textarea).summernote) {
                $(textarea).summernote('code', '');
            }
        }
    }

    function toggleNadwozie() {
        const typPojazdu = document.getElementById('typPojazdu').value;
        const osoboweContainer = document.getElementById('nadwozieOsoboweContainer');
        const ciezaroweContainer = document.getElementById('nadwozieCiezaroweContainer');
        const osoboweSelect = document.getElementById('rodzajNadwozia');
        const ciezaroweSelect = document.getElementById('rodzajNadwoziaCiezarowe');

        if (typPojazdu === 'OSOBOWY') {
            osoboweContainer.style.display = 'block';
            ciezaroweContainer.style.display = 'none';
            ciezaroweSelect.value = '';
            osoboweSelect.required = true;
            ciezaroweSelect.required = false;
        } else if (typPojazdu === 'DOSTAWCZY' || typPojazdu === 'CIEZAROWY') {
            osoboweContainer.style.display = 'none';
            ciezaroweContainer.style.display = 'block';
            osoboweSelect.value = '';
            osoboweSelect.required = false;
            ciezaroweSelect.required = true;
        } else {
            osoboweContainer.style.display = 'block';
            ciezaroweContainer.style.display = 'none';
            osoboweSelect.required = true;
            ciezaroweSelect.required = false;
        }
    }
</script>
</body>
</html>
