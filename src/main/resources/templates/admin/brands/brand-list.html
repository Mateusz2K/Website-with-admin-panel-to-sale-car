<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarządzanie Markami</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
</head>
<body>

<div th:replace="~{admin/fragments/navigation :: navbar}"></div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2">Zarządzanie Markami</h1>
        <a th:href="@{/admin/brands/new}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Dodaj Nową Markę
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Nazwa Marki</th>
                <th>Modele</th>
                <th class="text-center">Akcje</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="brand : ${brands}">
                <td class="fw-bold">
                    <!-- ZMIANA: Nazwa marki jest teraz linkiem do szczegółów -->
                    <a th:href="@{/admin/brands/{id}(id=${brand.id})}" th:text="${brand.nazwaMarki}"></a>
                </td>
                <td>
                    <span th:each="model, iterStat : ${brand.lista_modeli}"
                          th:text="${model.model + (!iterStat.last ? ', ' : '')}"
                          class="badge bg-secondary me-1"></span>
                </td>
                <td class="text-center">
                    <a th:href="@{/admin/brands/{brandId}/models/new(brandId=${brand.id})}" class="btn btn-sm btn-success btn-action" title="Dodaj Model">
                        <i class="fas fa-plus"></i>
                    </a>
                    <a th:href="@{/admin/brands/edit/{id}(id=${brand.id})}" class="btn btn-sm btn-warning btn-action" title="Edytuj Markę">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a th:href="@{/admin/brands/delete/{id}(id=${brand.id})}" class="btn btn-sm btn-danger btn-action"
                       onclick="return confirm('Czy na pewno chcesz usunąć tę markę i wszystkie jej modele?');" title="Usuń Markę">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${brands.isEmpty()}">
                <td colspan="3" class="text-center p-4">Brak marek do wyświetlenia.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
