<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły Marki</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
</head>
<body>

<div th:replace="~{admin/fragments/navigation :: navbar}"></div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2">Zarządzaj Modelami dla Marki: <span class="text-primary" th:text="${brand.nazwaMarki}"></span></h1>
        <a th:href="@{/admin/brands/{brandId}/models/new(brandId=${brand.id})}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Dodaj Nowy Model
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Nazwa Modelu</th>
                <th class="text-center">Akcje</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="model : ${brand.lista_modeli}">
                <td th:text="${model.model}"></td>
                <td class="text-center">
                    <a th:href="@{/admin/brands/models/edit/{id}(id=${model.id})}" class="btn btn-sm btn-warning btn-action" title="Edytuj Model">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a th:href="@{/admin/brands/models/delete/{id}(id=${model.id})}" class="btn btn-sm btn-danger btn-action"
                       onclick="return confirm('Czy na pewno chcesz usunąć ten model?');" title="Usuń Model">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${brand.lista_modeli.isEmpty()}">
                <td colspan="2" class="text-center p-4">Ta marka nie ma jeszcze żadnych modeli.</td>
            </tr>
            </tbody>
        </table>
    </div>
    <a th:href="@{/admin/brands}" class="btn btn-secondary mt-3">&larr; Wróć do listy marek</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
