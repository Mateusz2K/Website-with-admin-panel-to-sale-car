<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj Model</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
</head>
<body>

<div th:replace="~{admin/fragments/navigation :: navbar}"></div>

<main class="container mt-4">
    <div class="form-container">
        <h1 class="h2 mb-4">Dodaj Nowy Model do Marki <span class="text-primary" th:text="${brand.nazwaMarki}"></span></h1>

        <form th:action="@{/admin/brands/models}" th:object="${model}" method="post">
            <!-- Ukryte pole przechowujące ID marki, do której należy model -->
            <input type="hidden" th:field="*{brand}"/>

            <div class="mb-3">
                <label for="modelName" class="form-label">Nazwa Modelu</label>
                <input type="text" id="modelName" class="form-control" th:field="*{model}" required>
            </div>

            <hr>

            <button type="submit" class="btn btn-primary">Zapisz Model</button>
            <a th:href="@{/admin/brands}" class="btn btn-secondary">Anuluj</a>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
