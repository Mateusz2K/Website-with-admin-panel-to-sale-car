<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarządzaj Marką</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
</head>
<body>

<div th:replace="~{admin/fragments/navigation :: navbar}"></div>

<main class="container mt-4">
    <div class="form-container">
        <h1 class="h2 mb-4" th:text="${brand.id == null ? 'Dodaj Nową Markę' : 'Edytuj Markę'}">Tytuł</h1>

        <!-- ZMIANA: Dodano enctype do obsługi plików -->
        <form th:action="@{/admin/brands}" th:object="${brand}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label for="nazwaMarki" class="form-label">Nazwa Marki</label>
                <input type="text" id="nazwaMarki" class="form-control" th:field="*{nazwaMarki}" required>
            </div>

            <!-- ZMIANA: Poprawiona sekcja przesyłania pliku -->
            <div class="mb-4">
                <label for="iconFile" class="form-label">Ikona Marki</label>
                <!-- ZMIANA: Nazwa pola to "iconFile" -->
                <input class="form-control" type="file" id="iconFile" name="iconFile">
                <div class="form-text">Wybierz plik PNG/JPG/SVG. Jeśli edytujesz, pozostaw puste, aby nie zmieniać ikony.</div>
                <!-- Wyświetlanie obecnej ikony przy edycji -->
                <div th:if="${brand.iconUrl != null}" class="mt-2">
                    <img th:src="@{${brand.iconUrl}}" alt="Obecna ikona" style="max-height: 50px; background-color: #eee; padding: 5px; border-radius: 5px;">
                </div>
            </div>

            <hr>

            <button type="submit" class="btn btn-primary">Zapisz Markę</button>
            <a th:href="@{/admin/brands}" class="btn btn-secondary">Anuluj</a>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
