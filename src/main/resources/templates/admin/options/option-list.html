<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zarządzaj Wyposażeniem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
</head>
<body>
<div th:replace="~{admin/fragments/navigation :: navbar}"></div>
<main class="container mt-4">
    <h1 class="h2 mb-4">Zarządzaj Globalną Listą Wyposażenia</h1>
    <div class="row">
        <div class="col-md-4">
            <div class="form-container">
                <h3 class="h5">Dodaj nową opcję</h3>
                <!-- ZMIANA: Formularz powiązany z obiektem "newOption" -->
                <form th:action="@{/admin/options}" th:object="${newOption}" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nazwa opcji</label>
                        <!-- ZMIANA: Użycie th:field -->
                        <input type="text" id="name" class="form-control" th:field="*{name}" required>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">Kategoria</label>
                        <!-- ZMIANA: Użycie th:field -->
                        <select id="category" class="form-select" th:field="*{category}" required>
                            <option value="">-- Wybierz --</option>
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Dodaj</button>
                </form>
            </div>
        </div>
        <div class="col-md-8">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead class="table-dark"><tr><th>Nazwa</th><th>Kategoria</th><th>Akcje</th></tr></thead>
                    <tbody>
                        <tr th:each="option : ${options}">
                            <td th:text="${option.name}"></td>
                            <td><span class="badge bg-info" th:text="${option.category?.displayName}"></span></td>
                            <td><a th:href="@{/admin/options/delete/{id}(id=${option.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Usunięcie tej opcji usunie ją ze wszystkich ofert. Kontynuować?')">Usuń</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
