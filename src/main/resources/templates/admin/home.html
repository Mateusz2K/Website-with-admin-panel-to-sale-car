<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulpit - Panel Administracyjny</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
</head>
<body>

<div th:replace="~{admin/fragments/navigation :: navbar}"></div>

<main class="container mt-4">
    <h1 class="h2 mb-4">Pulpit</h1>

    <div class="row g-4 mb-4">
        <div class="col-md-6 offset-md-3">
            <div class="card text-center h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Aktywne Oferty</h5>
                    <p class="display-4 fw-bold" th:text="${activeOfferCount}">0</p>
                    <a th:href="@{/admin/offers}" class="btn btn-outline-primary">Zarządzaj Ofertami</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-6"><div class="d-grid gap-2"><a th:href="@{/admin/offers/new}" class="btn btn-primary btn-lg p-4"><i class="fas fa-plus-circle fa-2x mb-2"></i><br>Dodaj Nową Ofertę</a></div></div>
        <div class="col-md-6"><div class="d-grid gap-2"><a th:href="@{/admin/blog/new}" class="btn btn-info btn-lg p-4 text-dark"><i class="fas fa-pen-alt fa-2x mb-2"></i><br>Dodaj Nowy Wpis</a></div></div>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <h3 class="h4">Ostatnie Oferty</h3>
            <div class="list-group">
                <a th:each="offer : ${recentOffers}" th:href="@{/admin/offers/edit/{id}(id=${offer.id})}" class="list-group-item list-group-item-action">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1" th:text="${offer.brand?.nazwaMarki + ' ' + offer.model?.model}"></h5>
                        <small th:if="${offer.creationDate}" th:text="${#temporals.format(offer.creationDate, 'dd.MM.yyyy')}"></small>
                    </div>
                    <p class="mb-1" th:text="${{offer.cena}}"></p>
                </a>
                <!-- ZMIANA: Bezpieczny warunek sprawdzający, czy lista jest null lub pusta -->
                <div th:if="${recentOffers == null or recentOffers.isEmpty()}" class="list-group-item">Brak ofert.</div>
            </div>
        </div>
        <div class="col-lg-6">
            <h3 class="h4">Ostatnie Wpisy na Blogu</h3>
            <div class="list-group">
                <a th:each="post : ${recentBlogPosts}" th:href="@{/admin/blog/edit/{id}(id=${post.id})}" class="list-group-item list-group-item-action">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1" th:text="${post.tytul}"></h5>
                        <small th:if="${post.dataPublikacji}" th:text="${#temporals.format(post.dataPublikacji, 'dd.MM.yyyy')}"></small>
                    </div>
                    <p class="mb-1" th:text="${post.autor}"></p>
                </a>
                <!-- ZMIANA: Bezpieczny warunek sprawdzający, czy lista jest null lub pusta -->
                <div th:if="${recentBlogPosts == null or recentBlogPosts.isEmpty()}" class="list-group-item">Brak wpisów.</div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
